---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: agent-redis
  labels:
    app: agent-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: agent-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-redis
  labels:
    app: agent-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-redis
  template:
    metadata:
      labels:
        app: agent-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            {}

---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: agent-api
  labels:
    app: agent-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: agent-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-api
  labels:
    app: agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: agent-api
          image: git.tu-berlin.de:5000/zodiac/zodiac-meta/agent@sha256:03c20d7dafce4d4b02f29ce3dc021dd9a2d73be888bdd0b80acf3c49c8535a73
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: redis://agent-redis:6379
            - name: MCP_CLIENT_URL
              value: http://mcp-client-service:8001/chat
            - name: PORT
              value: "3000"
          resources:
            {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-worker
  labels:
    app: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: agent-worker
          image: git.tu-berlin.de:5000/zodiac/zodiac-meta/agent@sha256:03c20d7dafce4d4b02f29ce3dc021dd9a2d73be888bdd0b80acf3c49c8535a73
          imagePullPolicy: Always
          command: ["npm", "run", "worker"]
          env:
            - name: REDIS_URL
              value: redis://agent-redis:6379
            - name: MCP_CLIENT_URL
              value: http://mcp-client-service:8001/chat
          resources:
            {}