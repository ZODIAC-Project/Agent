---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: agent-redis
  labels:
    app: agent-redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app: agent-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-redis
  labels:
    app: agent-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-redis
  template:
    metadata:
      labels:
        app: agent-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            {}

---
apiVersion: v1
kind: Service
metadata:
  namespace: zodiac
  name: agent-api
  labels:
    app: agent-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30085
      protocol: TCP
  selector:
    app: agent-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-api
  labels:
    app: agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: agent-api
          image: sonak53/agent:x86
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: REDIS_URL
              value: redis://agent-redis:6379
            - name: MCP_CLIENT_URL
              value: http://mcp-client-service:8000/chat
            - name: PORT
              value: "3000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.zodiac.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: agent-api
          resources:
            {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: zodiac
  name: agent-worker
  labels:
    app: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-worker
  template:
    metadata:
      labels:
        app: agent-worker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: agent-worker
          image: sonak53/agent:x86
          imagePullPolicy: Always
          command: ["npm", "run", "worker"]
          env:
            - name: REDIS_URL
              value: redis://agent-redis:6379
            - name: MCP_CLIENT_URL
              value: http://mcp-client-service:8000/chat
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.zodiac.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: agent-worker
          resources:
            {}
